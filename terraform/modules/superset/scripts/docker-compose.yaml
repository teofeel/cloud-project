version: "3.8"

x-superset-image: &superset-image apache/superset:latest

services:
  postgres:
    image: postgres:15
    container_name: superset_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: superset
      POSTGRES_DB: superset
    volumes:
      - superset_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset"]
      interval: 5s
      timeout: 5s
      retries: 10

  superset-init:
    image: *superset-image
    container_name: superset_init
    depends_on:
      postgres:
        condition: service_healthy
    environment: &superset-env
      SUPERSET_SECRET_KEY: "IKN+MO1nNjb5gyOjmSE3jzISQFM3F6dsZV8M9osmdLpqD5LKP32NCTQH"
      SQLALCHEMY_DATABASE_URI: "postgresql+psycopg2://superset:superset@postgres:5432/superset"
    volumes:
      - superset_home:/app/superset_home
    entrypoint: /bin/sh
    command: >
      -c "
      superset db upgrade &&
      superset fab create-admin --username admin --firstname Admin --lastname Admin --email admin@admin.com --password admin &&
      superset init
      "
    restart: "no"

  superset:
    image: *superset-image
    container_name: superset_app
    restart: unless-stopped
    depends_on:
      - superset-init
    environment: *superset-env
    ports:
      - "8088:8088"
    volumes:
      - superset_home:/app/superset_home
    command: >
      /bin/sh -c "
      superset run -h 0.0.0.0 -p 8088 --with-threads --reload --debugger
      "

volumes:
  superset_postgres_data:
  superset_home: